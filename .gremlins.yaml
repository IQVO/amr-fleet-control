# .gremlins.yaml — mutation-testing configuration template (warehouse-harness-template v2).
#
# gremlins (github.com/go-gremlins/gremlins, pinned to v0.6.0 in CI) reads
# this file automatically from the Go module root, so the `mutation-fast`
# CI job, the scheduled exhaustive `mutation` CI job, the `drift` job's
# coverage-quality check, and the local `make mutation` / `make
# mutation-full` targets all run with identical settings.
#
# Mutation testing is the sensor that tells us whether the tests actually
# ASSERT rather than merely execute. The thresholds below turn it into a
# blocking quality gate instead of a report.
silent: false

unleash:
  # A single worker with a generous timeout coefficient avoids spurious
  # TIMED OUT results on modules where mutants finish in tens of
  # milliseconds but parallel workers contend over the build cache.
  workers: 1
  timeout-coefficient: 30

  threshold:
    # gremlins fails when the measured value is <= the threshold (internal/report/report.go in
    # gremlins itself), so a gate of 99 needs MORE than 99.00% in every run. PLAIN numbers: gremlins
    # v0.6.0 reads these two keys with a float type assertion, so a quoted value is read as 0 and
    # never gates.
    #
    # Measured 2026-11-21 (Task 22), per package, cold test cache, gremlins v0.6.0, workers 1,
    # timeout-coefficient 30 (killed / lived / not covered):
    #   fleetmap  efficacy 100.00%  mutant coverage 100.00%   (56 / 0 / 0)
    #   robot     efficacy 100.00%  mutant coverage 100.00%   (48 / 0 / 0)
    #   mission   efficacy  99.14%  mutant coverage 100.00%   (115 / 1 / 0; make mutation, the fast blocking subset)
    #   capacity  efficacy 100.00%  mutant coverage 100.00%   (8 / 0 / 0)
    #   dispatch  efficacy 100.00%  mutant coverage 100.00%   (39 / 0 / 0)
    #   ./internal/domain (make mutation-full): efficacy 99.62%  mutant coverage 100.00%   (265 / 1 / 0, 1 timed out)
    # The one living mutant is equivalent (mission.go fits, `dr > pick`); the timed-out one is a runaway loop
    # (route.go:35) that CI's `ulimit -v 4000000` kills: MUTATION.md.
    efficacy: 99
    mutant-coverage: 99
