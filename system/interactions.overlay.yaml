      process: leg-execution
      useCase: Service
      triggers:
        - { kind: schedule, ref: FleetLink.HandleState, actor: system }
      purpose: "Announce that the robot's pick action finished at the from handoff point and the container is on the robot."
      criticality: best-effort
      onFailure: outbox-retry
  - id: service-publish-container-picked-up-analytics
