      effect: write
      event: { channel: warehouse.amr-fleet-control.analytics, type: com.warehouse.wes.amr-fleet-control.mission.ContainerPickedUp }
    business:
      capability: fleet-control.mission-execution
      process: leg-execution
      useCase: Service
      triggers:
