      event: { channel: warehouse.amr-fleet-control.events, type: com.warehouse.wes.amr-fleet-control.fleet.FleetCapacityChanged }
    business:
      capability: fleet-control.fleet-capacity
      process: fleet-capacity-reporting
      useCase: Service
      triggers:
