      process: leg-execution
      useCase: Service
      triggers:
        - { kind: schedule, ref: FleetLink.HandleState, actor: system }
      purpose: "Announce that the robot's drop action finished at the to handoff point: one of the two outcomes of every accepted leg."
      criticality: best-effort
      onFailure: outbox-retry
  - id: service-publish-leg-completed-analytics
