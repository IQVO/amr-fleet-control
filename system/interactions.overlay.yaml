# Interactions of amr-fleet-control (STANDARD.md Part B): every call this
# context MAKES (technology + operation + business) and every event it
# consumes (subscriptions).
#
# Outbound rest / mcp / a2a interactions: NONE. amr-fleet-control calls no
# sibling context (CLAUDE.md hard rule 4: no outbound calls to sibling
# contexts without an ADR; cross-context data arrives as events). The only
# invocation technology it uses toward the fleet is event.publish, through the
# transactional outbox drained by the cmd/api relay, on warehouse.amr-fleet-control.events
# and its analytics twin (same id, type and data).
#
# Subscriptions: NONE. It consumes no Kafka topic (.claude/rules/integration-events.md,
# ADR 0003). Its uplink is MQTT (VDA 5050 robot state, connection, factsheet),
# which is not a CloudEvents subscription and has no kind in this standard;
# those entry points appear as `schedule` triggers named after the use-case methods
# the fleet link's single worker calls (FleetLink.HandleState, FleetLink.HandleConnection,
# FleetLink.HandleFactsheet, FleetLink.Tick every second; Service.Recover at boot).
#
# The application layer has ONE use-case type, usecases.Service (domain-model.md:
# "one Service"); the entry point is its method named in the triggers.
# Every write goes through one fleet unit of work; the 7 facts are raised there.
# The REST writes (requestLeg, cancelLeg) are called by material-flow-control
# (ADR 0006: writes belong to material-flow-control alone); the MCP tools and A2A
# skills are read-only (authority L1) and trigger nothing.
apiVersion: warehouse/interactions/v1
application: ../application.yaml

interactions:

  # --- LegAssigned
  - id: service-publish-leg-assigned
    technology: event.publish
    operation:
      asset: amr-fleet-control/asyncapi
      id: receiveAmrFleetControlEvents
      effect: write
      event: { channel: warehouse.amr-fleet-control.events, type: com.warehouse.wes.amr-fleet-control.mission.LegAssigned }
    business:
      capability: fleet-control.mission-assignment
      process: leg-assignment
      useCase: Service
      triggers:
        - { kind: api, via: rest, ref: requestLeg, actor: system }
        - { kind: api, via: rest, ref: cancelLeg, actor: system }
        - { kind: schedule, ref: FleetLink.Tick, actor: system }
        - { kind: schedule, ref: FleetLink.HandleState, actor: system }
        - { kind: schedule, ref: FleetLink.HandleConnection, actor: system }
        - { kind: schedule, ref: Service.Recover, actor: system }
      purpose: "Announce that a robot was chosen for the leg and its VDA 5050 order went out, pinned to one map version."
      criticality: best-effort
      onFailure: outbox-retry
  - id: service-publish-leg-assigned-analytics
    technology: event.publish
    operation:
      asset: amr-fleet-control/asyncapi
      id: receiveAmrFleetControlAnalytics
      effect: write
      event: { channel: warehouse.amr-fleet-control.analytics, type: com.warehouse.wes.amr-fleet-control.mission.LegAssigned }
    business:
      capability: fleet-control.mission-assignment
      process: leg-assignment
      useCase: Service
      triggers:
        - { kind: api, via: rest, ref: requestLeg, actor: system }
        - { kind: api, via: rest, ref: cancelLeg, actor: system }
        - { kind: schedule, ref: FleetLink.Tick, actor: system }
        - { kind: schedule, ref: FleetLink.HandleState, actor: system }
        - { kind: schedule, ref: FleetLink.HandleConnection, actor: system }
        - { kind: schedule, ref: Service.Recover, actor: system }
      purpose: "Analytics copy of LegAssigned (same id, type and data) for the data platform."
      criticality: best-effort
      onFailure: outbox-retry

  # --- ContainerPickedUp
