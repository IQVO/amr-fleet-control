# carry (plan 04 Task 23 review lesson a): an application values file shaped like warehouse-infra's
# helm-values/asrs-control.yaml (develop 5e45b8f) with the name swapped. render_test.sh renders it over
# fixtures/platform-values.yaml (a byte copy of warehouse-infra helm-values/_platform.yaml, last changed at 846e236,
# read at develop c5b65ae) the way the ArgoCD Application layers them: the platform file first. Brokers, the Gateway
# parentRefs, the CORS origin and the OTLP traces endpoint come from the platform file.

database:
  existingSecret: amr-fleet-control-db
  existingSecretKey: DATABASE_URL
  migrationsExistingSecretKey: MIGRATIONS_DATABASE_URL

gatewayApi:
  enabled: true

kongPlugins:
  cors:
    enabled: true
  prometheus:
    enabled: true
  opentelemetry:
    enabled: true

image:
  pullPolicy: IfNotPresent
  repository: warehouse/amr-fleet-control

service:
  type: ClusterIP

mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/amr-fleet-control
a2a:
  enabled: true
  route:
    enabled: true
    path: /api/a2a/amr-fleet-control
