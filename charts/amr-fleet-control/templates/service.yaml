apiVersion: v1
kind: Service
metadata:
  name: {{ include "amr-fleet-control.fullname" . }}
  labels:
    {{- include "amr-fleet-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "amr-fleet-control.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
