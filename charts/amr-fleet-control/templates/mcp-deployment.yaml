{{- if and .Values.mcp.enabled (not (include "amr-fleet-control.agentsColocated" .)) }}
{{- include "amr-fleet-control.require" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amr-fleet-control.mcpFullname" . }}
  labels:
    {{- include "amr-fleet-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  annotations:
    # agents.colocate cutover (ADR 0012): ArgoCD prunes this Deployment only after <release>-agents serves.
    # On the un-flip (rollback) wave -1 recreates it and waits Healthy before the wave-0 Services switch
    # back, so the rollback has no 503 window. Deployment-object annotations: syncing them rolls no pod.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "amr-fleet-control.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "amr-fleet-control.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "amr-fleet-control.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "amr-fleet-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          # Endpoint-removal drain (capacity step 3 follow-up): Kong routes to pod IPs and drops a terminating
          # pod only on its next config sync, seconds later, while cmd/mcp closes its listener at SIGTERM and an
          # idle process exits at once; without this delay Kong keeps sending to a vanished pod IP (a 502 or a
          # connect timeout through Kong on every roll). The kubelet-native sleep needs no shell (distroless).
          # terminationGracePeriodSeconds must stay above this sleep + the 10 s HTTP drain.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          # Exactly what cmd/mcp reads (Task 18): MCP_ADDR, LOG_LEVEL, AMR_MAP_FILE, SERVICE_VERSION,
          # OTEL_*, ENVIRONMENT, DATABASE_URL, MIGRATIONS_DATABASE_URL. The api ConfigMap is NOT mounted as env, so no
          # Kafka, MQTT or relay variable reaches it.
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: AMR_MAP_FILE
              value: {{ .Values.config.mapFile | quote }}
            - name: SERVICE_VERSION
              value: {{ include "amr-fleet-control.serviceVersion" . | quote }}
            # ruling P3-R16 / P4-R18: deployment.environment.name (read by the telemetry adapter).
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-mcp" .Values.otel.serviceName | quote }}
            {{- end }}
            {{- include "amr-fleet-control.databaseEnv" . | nindent 12 }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          volumeMounts:
            - name: map
              mountPath: {{ dir .Values.config.mapFile }}
              readOnly: true
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      volumes:
        {{- include "amr-fleet-control.mapVolume" . | nindent 8 }}
{{- end }}
