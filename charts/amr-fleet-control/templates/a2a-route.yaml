{{- if and .Values.gatewayApi.enabled .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /* ruling Note C: gatewayApi.enabled gates every HTTPRoute, like the api route (material-flow-control parity). */ -}}
{{- /*
/api/a2a/amr-fleet-control -> Service amr-fleet-control-a2a:8093, prefix rewritten to /. /healthz stays
off the host. Nothing on the route checks credentials (fleet rule).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "amr-fleet-control.a2aFullname" . }}
  labels:
    {{- include "amr-fleet-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  {{- with include "amr-fleet-control.kongPluginNames" . }}
  annotations:
    konghq.com/plugins: {{ . | quote }}
  {{- end }}
spec:
  # carry (plan 04 Task 23 review lesson a): a2a.route.parentRefs (warehouse-infra's _platform.yaml), else gatewayApi.parentRefs.
  parentRefs:
    {{- include "amr-fleet-control.parentRefs" (.Values.a2a.route.parentRefs | default .Values.gatewayApi.parentRefs) | trim | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "amr-fleet-control.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
