{{- if and .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /*
/api/a2a/amr-fleet-control -> Service amr-fleet-control-a2a:8093, prefix rewritten to /. /healthz stays
off the host. Nothing on the route checks credentials (fleet rule).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "amr-fleet-control.a2aFullname" . }}
  labels:
    {{- include "amr-fleet-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  {{- with include "amr-fleet-control.kongPluginNames" . }}
  annotations:
    konghq.com/plugins: {{ . | quote }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.a2a.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "amr-fleet-control.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
